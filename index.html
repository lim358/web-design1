 <html>
<head>
    <meta charset="UTF-8">
    <title>Web Design</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            margin: 20px;
        }

        .header {
            width: 100%;
            height: 100px;
            background-color: #e9ddfa;
            border: 4px solid #9966cc;
            border-radius: 20px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .nav {
            width: 100%;
            height: 80px;
            background-color: #dceeff;
            border: 4px solid #559bd1;
            border-radius: 20px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .container {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .main {
            width: 66%;
            height: 650px;
            background-color: #e0f3ed;
            border: 4px solid #54b99c;
            border-radius: 20px;
            padding: 25px;
            box-sizing: border-box;
        }

        .article {
            height: 250px;
            background-color: #f0e1d8;
            border: 4px solid #df7655;
            border-radius: 20px;
            margin-bottom: 15px;
            text-align: left;
            border-radius: 20px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .section {
            height: 250px;
            background-color: #dce5f7;
            border: 4px solid #8861c5;
            border-radius: 20px;
            text-align: left;
            padding: 15px;
            box-sizing: border-box;
        }

        .aside {
            width: 34%;
            height: 650px;
            background-color: #dcecf7;
            border: 4px solid #559bd1;
            border-radius: 20px;
            text-align: left;
            padding: 20px;
            box-sizing: border-box;
        }

        .footer {
            width: 100%;
            height: 100px;
            background-color: #dcefe9;
            border: 4px solid #54b99c;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>Welcome to my page</h1>
    </header>

    <nav class="nav">
        <h1>my home</h1>
    </nav>

    <div class="container">

        <main class="main">
            <h1>Contact</h1>

            <article class="article">
                <h1>About HTML</h1>
            </article>

            <section class="section">
                <h1>Thank you</h1>
            </section>

        </main>

        <aside class="aside">
            <h1>Bye</h1>
        </aside>

    </div>

    <footer class="footer">
        <h1>hahaha</h1>
    </footer>

</body>
</html>
